name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi
      release_tag:
        description: 'Recover an existing published version tag using this workflow from main'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}-${{ inputs.target || 'pypi' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  MESH_NO_AUTO_DAEMON: "1"
  MESH_NO_MODEL_DOWNLOAD: "1"
  MESH_NO_UPDATE_CHECK: "1"
  MESH_NO_IMPLICIT_CLOUD: "1"
  MESH_AUTO_APPROVE: "0"
  MESH_ENABLE_AUTO_SYNC: "0"
  MESH_ALLOW_CLOUD_CAPTURE: "0"
  MESH_ALLOW_CLOUD_SYNC: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build & Validate Release Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_commit: ${{ steps.qualify-source.outputs.source_sha }}
      release_tag: ${{ steps.qualify-source.outputs.release_tag }}
    permissions:
      id-token: write
      attestations: write
      contents: read
      actions: read
    steps:
      - name: Resolve and independently validate the existing publication source
        id: select-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/validate_publication_source.py" <<'PY'
          import hashlib, json, os, re, subprocess, sys, urllib.request
          from pathlib import Path

          SHA = re.compile(r'[0-9a-f]{40}\Z')
          TAG = re.compile(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[A-Za-z0-9.+-]+)?\Z')
          root = Path(os.environ['RUNNER_TEMP'])
          identity_path = root / 'release-source-identity.json'

          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)

          def save(report):
              identity_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

          def workflow_context():
              return {key: os.environ.get(key, '') for key in (
                  'GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_SHA',
                  'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}

          def validate_invocation(context, event):
              repository = context['GITHUB_REPOSITORY']
              require(repository.lower() == 'billighost/mesh', 'UnexpectedRepository')
              require(SHA.fullmatch(context['GITHUB_SHA']) and SHA.fullmatch(context['GITHUB_WORKFLOW_SHA']), 'InvalidWorkflowIdentity')
              require(context['GITHUB_SHA'] == context['GITHUB_WORKFLOW_SHA'], 'WorkflowInvocationSourceMismatch')
              require(context['GITHUB_WORKFLOW_REF'] == repository + '/.github/workflows/publish.yml@' + context['GITHUB_REF'], 'UnexpectedWorkflowRef')
              require(context['GITHUB_RUN_ID'].isdigit() and context['GITHUB_RUN_ATTEMPT'].isdigit(), 'InvalidWorkflowRunIdentity')
              inputs = event.get('inputs') or {}
              requested = inputs.get('release_tag', '')
              require(isinstance(requested, str), 'InvalidRecoveryTagInput')
              if context['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  require(inputs.get('target', 'pypi') in {'pypi', 'testpypi'}, 'InvalidPublicationTarget')
                  if requested:
                      require(context['GITHUB_REF'] == 'refs/heads/main', 'RecoveryRequiresMainInvocation')
                      tag, mode = requested, 'manual_main_recovery'
                  else:
                      require(context['GITHUB_REF'].startswith('refs/tags/'), 'ManualPublicationRequiresTagOrRecoveryInput')
                      tag, mode = context['GITHUB_REF'][10:], 'manual_tag'
              elif context['GITHUB_EVENT_NAME'] == 'release':
                  require(not requested and event.get('action') == 'published', 'PublishedReleaseEventRequired')
                  tag, mode = event.get('release', {}).get('tag_name'), 'published_release'
                  require(context['GITHUB_REF'] == 'refs/tags/' + str(tag), 'ReleaseEventTagMismatch')
              else:
                  raise RuntimeError('UnsupportedPublicationEvent')
              require(isinstance(tag, str) and TAG.fullmatch(tag), 'InvalidVersionTag')
              return tag, mode

          def github_read(path, observations):
              headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                         'User-Agent': 'Mesh-publication-source-identity'}
              token = os.environ.get('GITHUB_TOKEN')
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              request = urllib.request.Request('https://api.github.com/repos/billighost/Mesh/' + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(1048577)
              require(len(body) <= 1048576, 'OversizedSourceIdentityResponse')
              observations.append({'api_path': path, 'response_sha256': hashlib.sha256(body).hexdigest()})
              return json.loads(body)

          def existing_source(tag, observations):
              ref = github_read('git/ref/tags/' + tag, observations)
              require(ref.get('ref') == 'refs/tags/' + tag, 'TagRefMismatch')
              target = ref.get('object', {})
              require(target.get('type') == 'tag' and isinstance(target.get('sha'), str) and SHA.fullmatch(target['sha']), 'ExistingAnnotatedTagRequired')
              tag_object = github_read('git/tags/' + target['sha'], observations)
              require(tag_object.get('sha') == target['sha'] and tag_object.get('tag') == tag, 'AnnotatedTagIdentityMismatch')
              commit = tag_object.get('object', {})
              require(commit.get('type') == 'commit' and isinstance(commit.get('sha'), str) and SHA.fullmatch(commit['sha']), 'TagCommitRequired')
              release = github_read('releases/tags/' + tag, observations)
              require(release.get('tag_name') == tag and release.get('draft') is False and release.get('published_at'), 'ExistingPublishedReleaseRequired')
              require(type(release.get('id')) is int and release['id'] > 0, 'InvalidExistingReleaseIdentity')
              return {'tag': tag, 'tag_ref': 'refs/tags/' + tag, 'tag_object_sha': target['sha'],
                      'commit': commit['sha'], 'release_id': release['id']}

          def git(*arguments):
              return subprocess.check_output(['git', *arguments], text=True).strip()

          def outputs(source):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('source_sha=' + source['commit'] + '\nrelease_tag=' + source['tag'] + '\n')

          def main(mode):
              context = workflow_context()
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              report = {'schema_version': 1, 'status': 'failed', 'stage': mode, 'workflow_context': context}
              try:
                  tag, invocation = validate_invocation(context, event)
                  observations = []
                  source = existing_source(tag, observations)
                  report.update(invocation_mode=invocation, artifact_source=source, source_identity_observations=observations)
                  if invocation != 'manual_main_recovery':
                      require(context['GITHUB_SHA'] == source['commit'], 'TagEventSourceMismatch')
                  if invocation == 'published_release':
                      require(event['release'].get('id') == source['release_id'], 'PublishedReleaseIdentityMismatch')
                  if mode == 'select':
                      report.update(status='selected', stage='checkout_pending')
                      save(report)
                      outputs(source)
                      return
                  require(mode in {'qualify', 'build'}, 'InvalidValidationStage')
                  selected = json.loads(identity_path.read_text(encoding='utf-8'))
                  require(selected.get('status') == ('selected' if mode == 'qualify' else 'passed') and selected.get('workflow_context') == context and
                          selected.get('artifact_source') == source, 'SelectedPublicationSourceChanged')
                  require(git('rev-parse', 'HEAD') == source['commit'], 'CheckedOutSourceMismatch')
                  require(git('rev-parse', source['tag_ref']) == source['tag_object_sha'] and
                          git('rev-parse', source['tag_ref'] + '^{}') == source['commit'], 'LocalAnnotatedTagMismatch')
                  require(not git('status', '--porcelain'), 'CleanPublicationSourceRequired')
                  if mode == 'build':
                      require(selected.get('qualification', {}).get('status') == 'passed' and
                              selected['qualification'].get('commit') == source['commit'], 'QualifiedBuildSourceRequired')
                      report.update(selected, status='failed', stage='build', build_source_identity_observations=observations)
                      build_environment = os.environ.copy()
                      build_environment.update(GITHUB_SHA=source['commit'], PYTHONPATH='.')
                      report['build_source_context'] = {'GITHUB_SHA': source['commit'],
                          'independently_validated_tag_projection': True, 'parent_workflow_environment_unchanged': True}
                      result = subprocess.run([sys.executable, 'scripts/build_release.py'], env=build_environment, timeout=1200)
                      require(result.returncode == 0, 'QualifiedSourceBuildFailed')
                      provenance = json.loads(Path('dist/provenance.json').read_text(encoding='utf-8'))
                      require(provenance.get('commit') == source['commit'] and provenance.get('version') == selected['version'], 'BuiltSourceProvenanceMismatch')
                      report.update(status='passed', stage='built_source')
                      save(report)
                      return
                  # The legacy checker accepts a tag-oriented source context.
                  # Project only these independently validated identities into its
                  # subprocess; retain the genuine workflow context above and do
                  # not change the parent environment or OIDC/attestation context.
                  checker_environment = os.environ.copy()
                  checker_environment.update(GITHUB_REF=source['tag_ref'], GITHUB_SHA=source['commit'])
                  report['checker_source_context'] = {'GITHUB_REF': source['tag_ref'], 'GITHUB_SHA': source['commit'],
                      'independently_validated_tag_projection': True, 'parent_workflow_environment_unchanged': True}
                  result = subprocess.run([sys.executable, 'scripts/release_check.py', '--checks-only', '--verify-publication'],
                                          env=checker_environment, capture_output=True, text=True, timeout=300)
                  require(result.returncode == 0, 'UnchangedPublicationCheckerRejectedSource')
                  proofs = [json.loads(line) for line in result.stdout.splitlines() if line.startswith('{')]
                  require(len(proofs) == 1 and proofs[0].get('status') == 'passed' and
                          proofs[0].get('commit') == source['commit'] and proofs[0].get('tag') == tag, 'PublicationQualificationSourceMismatch')
                  version_text = Path('mesh/version.py').read_text(encoding='utf-8')
                  versions = re.findall(r'^VERSION = "([^"]+)"\s*$', version_text, re.M)
                  require(len(versions) == 1 and tag == 'v' + versions[0], 'VersionTagMismatch')
                  report.update(status='passed', stage='qualified_source', version=versions[0], qualification=proofs[0])
                  save(report)
                  outputs(source)
                  print(json.dumps({'status': 'passed', 'artifact_source_commit': source['commit'], 'release_tag': tag,
                                    'workflow_source_commit': context['GITHUB_WORKFLOW_SHA'], 'workflow_ref': context['GITHUB_WORKFLOW_REF']}))
              except Exception as exc:
                  report.update(status='failed', failure_type=type(exc).__name__)
                  save(report)
                  raise

          if __name__ == '__main__':
              main(sys.argv[1])
          PY
          python3 "$RUNNER_TEMP/validate_publication_source.py" select

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select-source.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify the release tag, current qualification and source-bound measurements
        id: qualify-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/validate_publication_source.py" qualify

      - name: Install Build & QA Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,secrets]" build twine ruff hatchling

      - name: Verify Code Quality
        run: |
          python -m ruff check .
          python scripts/check_skill.py
          python scripts/check_docs.py --release

      - name: Build Distributions & Generate SBOM / Provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/validate_publication_source.py" build

      - name: Preserve workflow and artifact source identity, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-identity
          path: ${{ runner.temp }}/release-source-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Validate the installed wheel and extracted source archive in isolated homes
        run: python scripts/validate_production_package.py dist --collect-sdist

      - name: Preserve installed package validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-validation
          path: .work/package-final-validation.json
          if-no-files-found: error

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI via Trusted Publishing (OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/p/mesh-context-layer' || 'https://pypi.org/p/mesh-context-layer' }}
    permissions:
      id-token: write  # MANDATORY for PyPI Trusted Publishing OIDC token exchange
      contents: read
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-packages
          path: dist

      - name: Isolate Wheels and Tarballs for PyPI Upload
        run: |
          mkdir -p dist_packages
          cp dist/*.whl dist/*.tar.gz dist_packages/

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist_packages/

      - name: Publish to PyPI
        if: ${{ github.event.inputs.target != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist_packages/

  verify-public-package:
    name: Verify Public Wheel Identity & Isolated Install
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLICATION_TARGET: ${{ github.event.inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      ARTIFACT_SOURCE_SHA: ${{ needs.build.outputs.source_commit }}
      VALIDATED_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Initialize publication verification evidence
        run: python -c "import json; from pathlib import Path; Path('public-package-verification.json').write_text(json.dumps({'status':'not_run','stage':'waiting_for_built_artifact'}) + '\n', encoding='utf-8')"

      - name: Download the exact built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-packages
          path: dist

      - name: Download the separately retained publication source identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-identity
          path: identity

      - name: Verify public bytes and smoke-test the installed wheel
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, sys, tempfile, time, urllib.error, urllib.parse, urllib.request, zipfile
          from email.parser import Parser
          from pathlib import Path
          report_path = Path('public-package-verification.json').resolve()
          report = {'status': 'failed', 'stage': 'built_metadata', 'repository': os.environ['PUBLICATION_TARGET']}
          def save():
              report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          def run(arguments, environment, directory, timeout=120):
              result = subprocess.run(arguments, env=environment, cwd=directory, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError('Isolated subprocess failed: ' + str(result.returncode))
              return result.stdout
          class ListedTemporaryDirectory(tempfile.TemporaryDirectory):
              def cleanup(self):
                  root = Path(self.name)
                  if root.exists():
                      entries = sorted(path.relative_to(root).as_posix() for path in root.rglob('*'))
                      report['temporary_inventory_entries'] = len(entries)
                      report['temporary_inventory_sha256'] = hashlib.sha256(json.dumps(entries).encode('utf-8')).hexdigest()
                  super().cleanup()
          try:
              wheels = list(Path('dist').glob('*.whl'))
              assert len(wheels) == 1, 'Expected one built wheel'
              built = wheels[0]
              built_bytes = built.read_bytes()
              expected = hashlib.sha256(built_bytes).hexdigest()
              with zipfile.ZipFile(built) as package:
                  names = [name for name in package.namelist() if name.endswith('.dist-info/METADATA')]
                  assert len(names) == 1
                  metadata = Parser().parsestr(package.read(names[0]).decode('utf-8'))
              version = metadata['Version']
              assert re.sub(r'[-_.]+', '-', metadata['Name']).lower() == 'mesh-context-layer'
              provenance = json.loads(Path('dist/provenance.json').read_text(encoding='utf-8'))
              identity = json.loads(Path('identity/release-source-identity.json').read_text(encoding='utf-8'))
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ['ARTIFACT_SOURCE_SHA'])
              assert provenance['version'] == version and provenance['commit'] == os.environ['ARTIFACT_SOURCE_SHA']
              assert identity['status'] == 'passed' and identity['stage'] == 'built_source' and identity['artifact_source']['commit'] == provenance['commit']
              assert identity['artifact_source']['tag'] == os.environ['VALIDATED_RELEASE_TAG'] == 'v' + version
              assert identity['qualification']['commit'] == provenance['commit'] and identity['qualification']['status'] == 'passed'
              for key in ('GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  assert identity['workflow_context'][key] == os.environ[key]
              report.update(version=version, source_commit=provenance['commit'], release_tag=os.environ['VALIDATED_RELEASE_TAG'],
                            workflow_context=identity['workflow_context'], source_identity_sha256=hashlib.sha256(Path('identity/release-source-identity.json').read_bytes()).hexdigest(),
                            wheel=built.name, built_sha256=expected, stage='public_index')
              save()
              target = os.environ['PUBLICATION_TARGET']
              assert target in {'pypi', 'testpypi'}
              index_host = 'test.pypi.org' if target == 'testpypi' else 'pypi.org'
              file_host = 'test-files.pythonhosted.org' if target == 'testpypi' else 'files.pythonhosted.org'
              url = f'https://{index_host}/pypi/mesh-context-layer/{urllib.parse.quote(version, safe="")}/json'
              entry = None
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          body = response.read(1048577)
                      assert len(body) <= 1048576, 'Oversized public metadata'
                      public = json.loads(body)
                      assert public['info']['version'] == version
                      matches = [item for item in public['urls'] if item['filename'] == built.name]
                      assert len(matches) <= 1, 'Ambiguous public wheel'
                      entry = matches[0] if matches else None
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {404, 429, 500, 502, 503, 504}:
                          raise
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  if entry is not None:
                      break
                  if attempt < 7:
                      time.sleep(10)
              assert entry is not None, 'Exact wheel unavailable from selected public index'
              assert not entry.get('yanked') and entry['packagetype'] == 'bdist_wheel'
              assert entry['digests']['sha256'] == expected, 'Public digest differs from built wheel'
              parsed = urllib.parse.urlsplit(entry['url'])
              assert parsed.scheme == 'https' and parsed.hostname == file_host and parsed.username is None
              with urllib.request.urlopen(entry['url'], timeout=30) as response:
                  final_url = urllib.parse.urlsplit(response.geturl())
                  assert final_url.scheme == 'https' and final_url.hostname == file_host
                  published_bytes = response.read(len(built_bytes) + 1)
              assert len(published_bytes) == len(built_bytes)
              assert hashlib.sha256(published_bytes).hexdigest() == expected, 'Downloaded wheel differs from built wheel'
              report.update(public_sha256=expected, downloaded_sha256=expected, public_identity_verified=True, stage='isolated_install')
              save()
              with ListedTemporaryDirectory(prefix='mesh-public-package-') as temporary:
                  root = Path(temporary).resolve()
                  environment = {name: value for name, value in os.environ.items() if name in {'PATH', 'LANG', 'LC_ALL', 'SYSTEMROOT'}}
                  bindings = {'HOME':'home', 'USERPROFILE':'home', 'MESH_HOME':'mesh', 'MESH_DIR':'mesh', 'APPDATA':'appdata', 'LOCALAPPDATA':'localappdata', 'XDG_CONFIG_HOME':'xdg/config', 'XDG_CACHE_HOME':'xdg/cache', 'XDG_DATA_HOME':'xdg/data', 'CODEX_HOME':'codex', 'CLAUDE_CONFIG_DIR':'claude', 'TMPDIR':'tmp', 'TMP':'tmp', 'TEMP':'tmp'}
                  for name, leaf in bindings.items():
                      path = root / leaf
                      path.mkdir(parents=True, exist_ok=True)
                      environment[name] = str(path)
                  environment.update(MESH_NO_AUTO_DAEMON='1', MESH_NO_DAEMON_PROXY='1', MESH_NO_MODEL_DOWNLOAD='1', MESH_NO_UPDATE_CHECK='1', MESH_NO_IMPLICIT_CLOUD='1', MESH_NO_OUTBOX_WORKER='1', MESH_AUTO_APPROVE='0', MESH_ENABLE_AUTO_SYNC='0', MESH_ALLOW_CLOUD_CAPTURE='0', MESH_ALLOW_CLOUD_SYNC='0', MESH_FORCE_HASH_EMBED='1', MESH_BG_ONNX='0', MESH_GROUP_COMMIT='0', HF_HUB_OFFLINE='1', TRANSFORMERS_OFFLINE='1', PYTHONNOUSERSITE='1', PIP_CONFIG_FILE=os.devnull, PIP_DISABLE_PIP_VERSION_CHECK='1', PIP_NO_CACHE_DIR='1')
                  wheel = root / built.name
                  wheel.write_bytes(published_bytes)
                  run([sys.executable, '-m', 'venv', str(root / 'venv')], environment, root)
                  python = str(root / 'venv/bin/python')
                  # The verified local wheel comes from the selected index; dependencies use PyPI.
                  run([python, '-m', 'pip', 'install', '--index-url', 'https://pypi.org/simple', str(wheel)], environment, root, timeout=300)
                  report.update(stage='installed_smoke', dependency_index='https://pypi.org/simple')
                  save()
                  cli_version = run([str(root / 'venv/bin/mesh'), 'version'], environment, root).strip()
                  assert cli_version == 'mesh ' + version
                  smoke = """
          import importlib.metadata, json, os, sys
          from pathlib import Path
          import mesh
          assert Path(mesh.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert mesh.__version__ == importlib.metadata.version('mesh-context-layer') == sys.argv[1]
          from mesh.client import ConnectionProfile, MeshClient
          from mesh.audit import stop_audit_worker
          from mesh.sqlite_runtime import sqlite3, is_patched_sqlite
          assert is_patched_sqlite(sqlite3.sqlite_version)
          try:
              profile = ConnectionProfile(namespace='public-package-smoke', mesh_home=Path(os.environ['MESH_HOME']), agent_id='publication-test')
              client = MeshClient(profile, transport='sdk')
              first = client.call('mesh_learn', {'content':'The package fixture service listens on port 8042.', 'deduplicate':False}, operation_id='public-package-fact-8042')
              replay = client.call('mesh_learn', {'content':'The package fixture service listens on port 8042.', 'deduplicate':False}, operation_id='public-package-fact-8042')
              assert replay['memory_id'] == first['memory_id'] and replay['replayed'] is True
              found = client.call('mesh_recall', {'query':'fixture service port', 'n':5})
              assert first['memory_id'] in {item['id'] for item in found['results']}
              print(json.dumps({'status':'passed', 'version':mesh.__version__, 'sqlite_version':sqlite3.sqlite_version, 'installed_import_verified':True, 'receipt_replay_verified':True, 'retrieval_verified':True}))
          finally:
              stop_audit_worker()
          """
                  report['smoke'] = json.loads(run([python, '-I', '-c', smoke, version], environment, root).splitlines()[-1])
                  report['cli_version_verified'] = True
              report.update(status='passed', stage='complete')
          except Exception as exc:
              report['failure_type'] = type(exc).__name__
              raise
          finally:
              save()
          PY

      - name: Preserve public package verification, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-package-verification
          path: public-package-verification.json
          if-no-files-found: error

  attach-github-release:
    name: Attach Artifacts to GitHub Release
    needs: [build, publish, verify-public-package]
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-packages
          path: dist

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/provenance.json
            dist/sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
