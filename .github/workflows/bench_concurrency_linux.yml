# Linux Concurrency & fcntl Lock Stress Test (GitHub Actions Runner Orchestration)
#
# Rules enforced (AGENTS.md and Pass 2 Directive 10):
# 1. Standard GitHub-hosted runners only (ubuntu-24.04, 4 vCPU, 16 GB RAM).
# 2. Least privilege: top-level permissions: contents: read.
# 3. Action pins: every action pinned to an immutable full commit SHA.
# 4. Tests Linux fcntl advisory locking path across multi-process and multi-agent workers.
# 5. Code freeze check: asserts git diff benchmark-v1 -- mesh/ is empty before execution.

name: "Bench: Linux Concurrency & Lock Stress"

on:
  push:
    branches:
      - "bench/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  concurrency-linux:
    name: "Linux fcntl Concurrency Stress (ubuntu-24.04)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0

      - name: "Code freeze verification (git diff benchmark-v1 -- mesh/)"
        run: |
          echo "Verifying code freeze against benchmark-v1 tag..."
          git fetch origin --tags
          DIFF_OUT=$(git diff benchmark-v1 -- mesh/)
          if [ -n "$DIFF_OUT" ]; then
            echo "ERROR: Code freeze violated! Non-empty git diff against benchmark-v1 in mesh/:"
            echo "$DIFF_OUT"
            exit 1
          fi
          echo "Code freeze verified: mesh/ is bit-for-bit identical to benchmark-v1."

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.12"

      - name: "Install Mesh and test dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: "Run Concurrency & Multi-Process Stress Test (Linux fcntl)"
        run: |
          python benchmarks/concurrency_stress.py --json --output concurrency_linux_results.json

      - name: "Run Multi-Agent 2, 5, 10 Process Suite & Integrity Check"
        run: |
          python benchmarks/run_concurrency_pass2.py --output multiagent_linux_results.json

      - name: "Upload Concurrency Test Artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.1
        with:
          name: linux-concurrency-results
          path: |
            concurrency_linux_results.json
            multiagent_linux_results.json

