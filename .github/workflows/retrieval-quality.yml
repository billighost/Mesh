name: Retrieval quality

"on":
  workflow_call:
    inputs:
      qualification_run_id:
        description: "Qualification artifact run; omitted means this caller run"
        required: false
        type: string
        default: ""
      run_c4:
        description: "Optional C4 experiment and actual Mesh.recall qualification when runtime passages are requested"
        required: false
        type: boolean
        default: false
      run_runtime_passages:
        description: "Separate actual schema-6 runtime passage-index evaluation on original parents"
        required: false
        type: boolean
        default: false
      rerank_profile_set:
        description: "Use standard profiles or the experimental compact-80 profile; preserves the full dataset and gate selection"
        required: false
        type: string
        default: "standard"
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: "Successful same-source production qualification run ID"
        required: true
        type: string
      run_c4:
        description: "Run optional C4; with runtime passages, qualify actual Mesh.recall before legacy experiments"
        required: false
        type: boolean
        default: false
      run_runtime_passages:
        description: "Run the separate optional runtime passage-index condition paired with fresh-default"
        required: false
        type: boolean
        default: false
      rerank_profile_set:
        description: "Use the existing three reranker profiles or the experimental compact-80 profile"
        required: false
        type: choice
        options: ["standard", "compact-80"]
        default: "standard"

permissions:
  contents: read
  actions: read

concurrency:
  group: retrieval-quality-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  public-quality:
    name: Guarded retrieval (${{ matrix.dataset }}, ${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        dataset: [nfcorpus, scifact, prospective, longtext-prospective, longmemeval]
        profile: ${{ inputs.run_c4 && inputs.run_runtime_passages && fromJSON(inputs.rerank_profile_set == 'compact-80' && '["compact-80"]' || '["full-256", "compact-128", "compact-96"]') || fromJSON('["full-256"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      RETRIEVAL_RUN_C4: ${{ inputs.run_c4 }}
      RETRIEVAL_RUN_RUNTIME_PASSAGES: ${{ inputs.run_runtime_passages }}
      RETRIEVAL_DATASET: ${{ matrix.dataset }}
      RETRIEVAL_RERANK_PROFILE: ${{ matrix.profile }}
      RETRIEVAL_ROOT: .work/retrieval-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.dataset }}
      RETRIEVAL_MODELS: .work/production-models/embedding
      MESH_NO_AUTO_DAEMON: "1"
      MESH_NO_MODEL_DOWNLOAD: "1"
      MESH_NO_UPDATE_CHECK: "1"
      MESH_NO_IMPLICIT_CLOUD: "1"
      MESH_AUTO_APPROVE: "0"
      MESH_ENABLE_AUTO_SYNC: "0"
      MESH_ALLOW_CLOUD_CAPTURE: "0"
      MESH_ALLOW_CLOUD_SYNC: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create isolated directories and initial failure-safe artifact
        env:
          MESH_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/mesh-home
          HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/home
          USERPROFILE: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/home
          APPDATA: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/appdata
          LOCALAPPDATA: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/localappdata
          XDG_CONFIG_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/xdg/cache
          XDG_DATA_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/xdg/data
          CODEX_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/claude
          CLAUDE_HOME: ${{ runner.temp }}/mesh-retrieval-ci-config-${{ matrix.dataset }}/claude
        run: |
          foreach ($taskIsolatedEnvName in @("MESH_HOME", "HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_DATA_HOME", "CODEX_HOME", "CLAUDE_CONFIG_DIR", "CLAUDE_HOME")) {
            $taskIsolatedEnvValue = [Environment]::GetEnvironmentVariable($taskIsolatedEnvName)
            "$taskIsolatedEnvName=$taskIsolatedEnvValue" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          New-Item -ItemType Directory -Force -Path $env:MESH_HOME,$env:HOME,$env:APPDATA,$env:LOCALAPPDATA,$env:XDG_CONFIG_HOME,$env:XDG_CACHE_HOME,$env:XDG_DATA_HOME,$env:CODEX_HOME,$env:CLAUDE_CONFIG_DIR | Out-Null
          $taskRetrievalInitArgs = @("benchmarks/retrieval_ci.py", "init", $env:RETRIEVAL_DATASET, "--output-root", $env:RETRIEVAL_ROOT, "--runtime-rerank-profile", $env:RETRIEVAL_RERANK_PROFILE)
          if ($env:RETRIEVAL_RUN_C4 -eq "true") { $taskRetrievalInitArgs += @("--reranker-experiment", "c4") }
          if ($env:RETRIEVAL_RUN_RUNTIME_PASSAGES -eq "true") { $taskRetrievalInitArgs += "--runtime-passages" }
          python @taskRetrievalInitArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the requested runtime reranker profile set
        if: inputs.rerank_profile_set != 'standard' && inputs.rerank_profile_set != 'compact-80'
        run: throw "Unsupported runtime reranker profile set"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.0"
          cache: pip
      - name: Download same-source primary qualification
        uses: actions/download-artifact@v4
        with:
          name: production-qualification-primary
          path: .work/qualification/primary
          run-id: ${{ inputs.qualification_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download same-source minimum qualification
        uses: actions/download-artifact@v4
        with:
          name: production-qualification-floor
          path: .work/qualification/floor
          run-id: ${{ inputs.qualification_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install exactly qualified dependency versions
        run: |
          python -m pip install -c .work/qualification/primary/constraints.txt ".[test,secrets]" psutil
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore fixed public local embedding pair
        id: embedding_cache
        timeout-minutes: 7
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.RETRIEVAL_MODELS }}/model.onnx
            ${{ env.RETRIEVAL_MODELS }}/tokenizer.json
          key: retrieval-minilm-1110a243fdf4706b-6fd5d72fe4589f18-be50c3628f2bf5bb
      - name: Prepare and verify pinned embedding cache files
        id: embedding_fixture
        timeout-minutes: 7
        continue-on-error: true
        run: |
          python benchmarks/provision_production_model.py --directory $env:RETRIEVAL_MODELS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "verified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Save only the verified embedding files
        if: steps.embedding_cache.outputs.cache-hit != 'true' && steps.embedding_fixture.outputs.verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.RETRIEVAL_MODELS }}/model.onnx
            ${{ env.RETRIEVAL_MODELS }}/tokenizer.json
          key: retrieval-minilm-1110a243fdf4706b-6fd5d72fe4589f18-be50c3628f2bf5bb
      - name: Restore the pinned optional local cross encoder
        if: inputs.run_c4
        id: c4_cache
        timeout-minutes: 7
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            .work/production-models/c4-minilm-ce/model.onnx
            .work/production-models/c4-minilm-ce/tokenizer.json
          key: retrieval-c4-minilm-a0914435-e9d8ebf845c413e9-d241a60d5e8f04cc
      - name: Prepare and verify pinned optional cross encoder cache files
        if: inputs.run_c4
        id: c4_fixture
        timeout-minutes: 7
        continue-on-error: true
        run: |
          python benchmarks/provision_retrieval_c4.py --repository . --directory .work/production-models/c4-minilm-ce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "verified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Save only the verified optional cross encoder files
        if: inputs.run_c4 && steps.c4_cache.outputs.cache-hit != 'true' && steps.c4_fixture.outputs.verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .work/production-models/c4-minilm-ce/model.onnx
            .work/production-models/c4-minilm-ce/tokenizer.json
          key: retrieval-c4-minilm-a0914435-e9d8ebf845c413e9-d241a60d5e8f04cc
      - name: Qualify source and supervise independent retrieval conditions
        run: |
          $taskRetrievalArgs = @("benchmarks/retrieval_ci.py", "run", $env:RETRIEVAL_DATASET, "--output-root", $env:RETRIEVAL_ROOT, "--runtime-rerank-profile", $env:RETRIEVAL_RERANK_PROFILE, "--model-directory", $env:RETRIEVAL_MODELS, "--qualification-directory", ".work/qualification/primary", "--floor-qualification-directory", ".work/qualification/floor", "--wall-seconds", "4200", "--rss-mib", "4096", "--cpu-seconds", "3600")
          if ($env:RETRIEVAL_RUN_C4 -eq "true") { $taskRetrievalArgs += @("--reranker-experiment", "c4") }
          if ($env:RETRIEVAL_RUN_RUNTIME_PASSAGES -eq "true") { $taskRetrievalArgs += "--runtime-passages" }
          python @taskRetrievalArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mark an interrupted workflow in the sanitized artifact
        if: always()
        run: >-
          python benchmarks/retrieval_ci.py finalize $env:RETRIEVAL_DATASET
          --output-root $env:RETRIEVAL_ROOT
      - name: Always preserve sanitized success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-${{ matrix.dataset }}-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ env.RETRIEVAL_ROOT }}/job-summary.json
          if-no-files-found: error
          retention-days: 30
