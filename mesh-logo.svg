<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f1a17"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <polygon id="hex" points="0,-88 76.2,-44 76.2,44 0,88 -76.2,44 -76.2,-44" stroke-linejoin="round"/>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- outer ring (faintest) -->
  <g fill="#10b981" fill-opacity="0.03" stroke="#10b981" stroke-opacity="0.14" stroke-width="4">
    <use xlink:href="#hex" x="858.4" y="512"/>
    <use xlink:href="#hex" x="685.2" y="812"/>
    <use xlink:href="#hex" x="338.8" y="812"/>
    <use xlink:href="#hex" x="165.6" y="512"/>
    <use xlink:href="#hex" x="338.8" y="212"/>
    <use xlink:href="#hex" x="685.2" y="212"/>
    <use xlink:href="#hex" x="771.8" y="662"/>
    <use xlink:href="#hex" x="512" y="812"/>
    <use xlink:href="#hex" x="252.2" y="662"/>
    <use xlink:href="#hex" x="252.2" y="362"/>
    <use xlink:href="#hex" x="512" y="212"/>
    <use xlink:href="#hex" x="771.8" y="362"/>
  </g>

  <!-- inner ring (faded) -->
  <g fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.38" stroke-width="5">
    <use xlink:href="#hex" x="685.2" y="512"/>
    <use xlink:href="#hex" x="598.6" y="662"/>
    <use xlink:href="#hex" x="425.4" y="662"/>
    <use xlink:href="#hex" x="338.8" y="512"/>
    <use xlink:href="#hex" x="425.4" y="362"/>
    <use xlink:href="#hex" x="598.6" y="362"/>
  </g>

  <!-- glow -->
  <circle cx="512" cy="512" r="190" fill="url(#halo)"/>
  <use xlink:href="#hex" x="512" y="512" fill="#10b981" fill-opacity="0.7" filter="url(#blur)"/>

  <!-- glowing core hexagon -->
  <use xlink:href="#hex" x="512" y="512" fill="url(#core)" stroke="#a7f3d0" stroke-opacity="0.7" stroke-width="4"/>
</svg>
