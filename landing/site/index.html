<!doctype html>
<html lang="en" data-theme="light" data-theme-pref="light" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesh — shared memory for AI agents</title>
    <meta
      name="description"
      content="Mesh is a high-speed shared semantic and hybrid memory layer for AI agents. One agent learns a fact; every other agent recalls it locally in under 0.1 ms."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D08" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://mesh.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mesh" />
    <meta property="og:title" content="Mesh — your agents are brilliant. And they have amnesia." />
    <meta
      property="og:description"
      content="Shared semantic + hybrid memory for AI agents. Local-first, MIT, five retrieval stages, no external database daemon."
    />
    <meta property="og:url" content="https://mesh.example/" />
    <meta property="og:image" content="https://mesh.example/assets/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mesh — shared memory for AI agents" />
    <meta
      name="twitter:description"
      content="One agent learns a fact. Every other agent recalls it locally. MIT, Python 3.10+, no external database daemon."
    />
    <meta name="twitter:image" content="https://mesh.example/assets/brand/og-image.png" />

    <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon-180.png" />
    <link rel="mask-icon" href="/assets/brand/safari-pinned-tab.svg" color="#0B0D08" />
    <link rel="manifest" href="/assets/brand/site.webmanifest" />
    <meta name="msapplication-config" content="/assets/brand/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#0B0D08" />
    <meta name="apple-mobile-web-app-title" content="Mesh" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var root = document.documentElement;
          var pref = localStorage.getItem("mesh-theme");
          // White is the default. System stays opt-in once a visitor picks it.
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "light";
          var dark = pref === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : pref === "dark";
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePref = pref;
          root.style.colorScheme = dark ? "dark" : "light";
          var motion = localStorage.getItem("mesh-motion");
          if (motion !== "on" && motion !== "off") {
            motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on";
          }
          root.dataset.motion = motion;
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Mesh",
        "description": "High-speed shared semantic and hybrid memory layer for AI agents.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS, Linux, Windows",
        "url": "https://github.com/billighost/mesh",
        "sameAs": [
          "https://github.com/billighost/mesh",
          "https://pypi.org/project/mesh-context-layer/",
          "https://www.agensi.io/skills/mesh-context-layer"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "softwareVersion": "0.6.4"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
