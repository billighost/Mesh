[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-context-layer"
version = "0.7.2"
description = "High-speed shared semantic & hybrid memory layer for AI agents — MCP server, CLI, and Python library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "memory", "mcp", "llm", "claude", "cursor", "hybrid-search", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    # mcp 2.0 replaced Server.list_tools()/call_tool() decorators with
    # constructor callbacks; mesh still targets the 1.x handler API.
    "mcp>=1.0.0,<2",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pytorch = [
    "sentence-transformers>=3.0.0",
]
fastembed = [
    "fastembed>=0.3.0",
]
legacy = [
    "chromadb>=0.5.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
mesh = "mesh.cli:main"
mesh-setup = "mesh.cli:setup_cmd"
mesh-help = "mesh.cli:help_cmd"
mesh-server = "mesh.mcp_server:run"
mesh-dashboard = "mesh.dashboard:run"
mesh-export = "mesh.cli:export_cmd"
mesh-import = "mesh.cli:import_cmd"
mesh-namespaces = "mesh.cli:namespaces_cmd"
mesh-http = "mesh.http_server:start"
mesh-server-http = "mesh.http_server:start"
mesh-daemon = "mesh.daemon:daemon_cmd"
mesh-context = "mesh.cli:context_cmd"
mesh-add = "mesh.cli:add_cmd"
mesh-ask = "mesh.cli:ask_cmd"
mesh-inspect = "mesh.cli:inspect_cmd"
mesh-update = "mesh.cli:update_cmd"
mesh-forget = "mesh.cli:forget_cmd"
mesh-why = "mesh.cli:why_cmd"
mesh-status = "mesh.cli:status_cmd"
mesh-conflicts = "mesh.cli:conflicts_cmd"
mesh-patterns = "mesh.cli:patterns_cmd"
mesh-doctor = "mesh.cli:doctor_cmd"
mesh-shell = "mesh.cli:shell_cmd"
mesh-completion = "mesh.cli:completion_cmd"
mesh-capture = "mesh.passive:capture_cmd"
mesh-digest = "mesh.digest:digest_cmd"
mesh-install-skills = "mesh.cli:install_skills_cmd"

[project.urls]
Homepage = "https://github.com/billighost/mesh"
Repository = "https://github.com/billighost/mesh"
Changelog = "https://github.com/billighost/mesh/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mesh"]
include = [
    "mesh/**/*.py",
    "mesh/skills/**/*.md",
    "mesh/skills/**/*.txt",
    "mesh/skills/**/*.json",
]

[tool.hatch.build.targets.sdist]
# The landing site is a separate frontend artifact; keep it out of the
# Python source distribution so the package stays small.
exclude = [
    "/landing",
    "/.github",
]