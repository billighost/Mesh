[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-context-layer"
version = "0.8.2"
description = "High-speed shared semantic & hybrid memory layer for AI agents — MCP server, CLI, and Python library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "memory", "mcp", "llm", "claude", "cursor", "hybrid-search", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    # mcp 2.0 replaced Server.list_tools()/call_tool() decorators with
    # constructor callbacks; mesh still targets the 1.x handler API.
    "mcp>=1.0.0,<2",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
secrets = [
    "keyring>=24.0.0",
]
crypto = [
    "cryptography>=42.0.0",
    "sqlcipher3-binary>=0.5.0; platform_system != 'Windows'",
]
pytorch = [
    "sentence-transformers>=3.0.0",
]
fastembed = [
    "fastembed>=0.3.0",
]
legacy = [
    "chromadb>=0.5.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
mesh = "mesh.cli:main"
mesh-setup = "mesh.cli:setup_cmd"
mesh-help = "mesh.cli:help_cmd"
mesh-server = "mesh.mcp_server:run"
mesh-dashboard = "mesh.dashboard:run"
mesh-export = "mesh.cli:export_cmd"
mesh-import = "mesh.cli:import_cmd"
mesh-namespaces = "mesh.cli:namespaces_cmd"
mesh-http = "mesh.http_server:start"
mesh-server-http = "mesh.http_server:start"
mesh-daemon = "mesh.daemon:daemon_cmd"
mesh-context = "mesh.cli:context_cmd"
mesh-add = "mesh.cli:add_cmd"
mesh-ask = "mesh.cli:ask_cmd"
mesh-inspect = "mesh.cli:inspect_cmd"
mesh-update = "mesh.cli:update_cmd"
mesh-forget = "mesh.cli:forget_cmd"
mesh-approve = "mesh.cli:approve_cmd"
mesh-run = "mesh.cli:run_cmd"
mesh-encrypt-db = "mesh.cli:encrypt_db_cmd"
mesh-why = "mesh.cli:why_cmd"
mesh-status = "mesh.cli:status_cmd"
mesh-conflicts = "mesh.cli:conflicts_cmd"
mesh-patterns = "mesh.cli:patterns_cmd"
mesh-doctor = "mesh.cli:doctor_cmd"
mesh-shell = "mesh.cli:shell_cmd"
mesh-completion = "mesh.cli:completion_cmd"
mesh-capture = "mesh.passive:capture_cmd"
mesh-digest = "mesh.digest:digest_cmd"
mesh-install-skills = "mesh.cli:install_skills_cmd"

[project.urls]
Homepage = "https://github.com/billighost/mesh"
Repository = "https://github.com/billighost/mesh"
Changelog = "https://github.com/billighost/mesh/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mesh"]
include = [
    "mesh/**/*.py",
    "mesh/skills/**/*.md",
    "mesh/skills/**/*.txt",
    "mesh/skills/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/mesh",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/ARCHITECTURE.md",
    "/DEVELOPER_GUIDE.md",
    "/DOCS.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/llms.txt",
    "/SECURITY.md",
    "/THREAT_MODEL.md",
    "/pyproject.toml",
]
exclude = [
    "/landing",
    "/marketing",
    "/docs",
    "/benchmarks",
    "/assets",
    "/.github",
    "*.mp4",
    "*.mp3",
    "*.wav",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "marketing",
    "landing",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", # Line length handled by formatter
    "E402", # Module level import not at top of file
    "E741", # Ambiguous variable name
    "E731", # Lambda assignment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "F841"]
"benchmarks/*" = ["E501", "F401"]
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    "^marketing/",
    "^landing/",
    "^tests/",
    "^benchmarks/",
]

[tool.bandit]
targets = ["mesh"]
skips = ["B101", "B608", "B310"]
exclude_dirs = ["tests", "benchmarks", "marketing", "landing", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["mesh"]
omit = [
    "mesh/skills/**",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]