[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-context-layer"
version = "0.4.4"
description = "Shared memory layer for AI agents — MCP server and Python library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "memory", "mcp", "llm", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "mcp>=1.0.0",
    "click>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
mesh = "mesh.cli:main"
mesh-help = "mesh.cli:help_cmd"
mesh-server = "mesh.mcp_server:run"
mesh-dashboard = "mesh.dashboard:run"
mesh-export = "mesh.cli:export_cmd"
mesh-import = "mesh.cli:import_cmd"
mesh-namespaces = "mesh.cli:namespaces_cmd"
mesh-http = "mesh.http_server:start"
mesh-context = "mesh.cli:context_cmd"
mesh-add = "mesh.cli:add_cmd"
mesh-ask = "mesh.cli:ask_cmd"
mesh-why = "mesh.cli:why_cmd"
mesh-status = "mesh.cli:status_cmd"
mesh-capture = "mesh.passive:capture_cmd"
mesh-digest = "mesh.digest:digest_cmd"

[project.urls]
Homepage = "https://github.com/billighost/mesh"
Repository = "https://github.com/billighost/mesh"

[tool.hatch.build.targets.wheel]
packages = ["mesh"]
